<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="LE RISORSE PUBBLICHE SOTTO ESAME"><rect width="1200" height="650" fill="#101215"/><rect x="0" y="0" width="12" height="650" fill="#e63e4f"/><text x="52" y="52" fill="#f14b60" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">S-COMODO / INCHIESTA DOCUMENTATA</text><text x="52" y="110" fill="#f7f7f7" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700">LE RISORSE PUBBLICHE SOTTO ESAME</text><text x="52" y="148" fill="#bfc2c6" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">Importi di esposizione, NON perdite definitivamente accertate</text><rect x="55" y="220" width="515" height="220" rx="14" fill="#352026" stroke="#ed4454" stroke-width="2"/><text x="75" y="262" fill="#fa5260" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">~850 milioni USD</text><text x="75" y="297" fill="#e6e6e6" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Fondi pubblici</text><text x="75" y="332" fill="#e6e6e6" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">dati riportati da Reuters</text><rect x="625" y="220" width="515" height="220" rx="14" fill="#22262a" stroke="#6b6f75" stroke-width="2"/><text x="645" y="262" fill="#fa5260" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">~355 milioni USD</text><text x="645" y="297" fill="#e6e6e6" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">Esposizione IPS</text><text x="645" y="332" fill="#e6e6e6" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">dato da verificare nel tempo</text><text x="80" y="515" fill="#ff7180" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Quanto si potrà recuperare? E chi autorizzò i depositi?</text><path d="M52 576 H1146" stroke="#44494d" stroke-width="1"/><text x="52" y="615" fill="#c6c7c9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Importi non sommabili: l'IPS è una componente dei fondi pubblici</text></svg>