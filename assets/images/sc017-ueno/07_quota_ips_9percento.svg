<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="IPS: ESPOSIZIONE NEL PORTAFOGLIO"><rect width="1200" height="650" fill="#101215"/><rect x="0" y="0" width="12" height="650" fill="#e63e4f"/><text x="52" y="52" fill="#f14b60" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">S-COMODO / INCHIESTA DOCUMENTATA</text><text x="52" y="110" fill="#f7f7f7" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700">IPS: ESPOSIZIONE NEL PORTAFOGLIO</text><text x="52" y="148" fill="#bfc2c6" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">Quota indicativa dei propri investimenti, non perdita realizzata</text><rect x="100" y="258" width="1000" height="120" rx="10" fill="#565c62"/><rect x="100" y="258" width="90" height="120" rx="10" fill="#ee4557"/><text x="100" y="440" fill="#ff606d" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">9% · esposizione presso ueno</text><text x="100" y="494" fill="#e1e3e5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400">91% · altre posizioni del portafoglio</text><path d="M52 576 H1146" stroke="#44494d" stroke-width="1"/><text x="52" y="615" fill="#c6c7c9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">La percentuale non prova che il restante portafoglio sia privo di rischio</text></svg>