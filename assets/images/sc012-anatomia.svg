<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 320" role="img" aria-labelledby="t d"><title id="t">Anatomia di un messaggio persuasivo</title><desc id="d">Tre pannelli: attenzione, esclusività, certezza. La sequenza è uno schema interpretativo dell'esercizio, non una classificazione scientifica.</desc><rect width="1140" height="320" fill="#172832" rx="22"/><text x="40" y="51" font-family="Arial,sans-serif" font-weight="800" font-size="25" fill="#f4efe7">ANATOMIA DEL MESSAGGIO</text><g font-family="Arial,sans-serif"><rect x="40" y="80" width="315" height="184" rx="13" fill="#f7f0e7"/><text x="62" y="122" font-size="17" fill="#ac2430" font-weight="800">01 · ATTENZIONE</text><text x="62" y="161" font-size="25" fill="#162b34" font-weight="700">«Sta succedendo</text><text x="62" y="192" font-size="25" fill="#162b34" font-weight="700">qualcosa di enorme»</text><text x="62" y="229" font-size="16" fill="#665d55">Crea aspettativa</text><rect x="413" y="80" width="315" height="184" rx="13" fill="#f7f0e7"/><text x="435" y="122" font-size="17" fill="#ac2430" font-weight="800">02 · ESCLUSIVITÀ</text><text x="435" y="161" font-size="25" fill="#162b34" font-weight="700">«Gli altri non</text><text x="435" y="192" font-size="25" fill="#162b34" font-weight="700">hanno capito»</text><text x="435" y="229" font-size="16" fill="#665d55">Crea un divario</text><rect x="786" y="80" width="314" height="184" rx="13" fill="#f7f0e7"/><text x="808" y="122" font-size="17" fill="#ac2430" font-weight="800">03 · CERTEZZA</text><text x="808" y="161" font-size="25" fill="#162b34" font-weight="700">«Questo cambia</text><text x="808" y="192" font-size="25" fill="#162b34" font-weight="700">tutto»</text><text x="808" y="229" font-size="16" fill="#665d55">Chiude il giudizio</text><path d="M370 170l29 0m-11 -12l11 12l-11 12M743 170l29 0m-11 -12l11 12l-11 12" stroke="#edc777" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="294" font-size="14" fill="#d9d6cf">Schema didattico S-COMODO: nessuna di queste tre frasi è attribuita come citazione letterale verificata a Matt Shumer.</text></g></svg>