<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Alberghi cubani: occupazione 18,9%</title><desc id="desc">Indicatore ufficiale per il 2025, pubblicato da ONEI nel marzo 2026 </desc><rect width="1200" height="630" fill="#f7f5ef"/><rect width="1200" height="14" fill="#142638"/><rect x="56" y="53" width="110" height="5" rx="2" fill="#cc4d3f"/><text x="56" y="98" font-family="Arial,sans-serif" font-size="20" letter-spacing="4" fill="#ab4037" font-weight="700">S-COMODO · DATI E CONTESTO</text><text x="56" y="165" font-family="Arial,sans-serif" font-size="43" font-weight="800" fill="#132536">Alberghi cubani: occupazione 18,9%</text><text x="56" y="208" font-family="Arial,sans-serif" font-size="23" fill="#526579">Indicatore ufficiale per il 2025, pubblicato da ONEI nel marzo 2026</text><circle cx="315" cy="397" r="111" fill="none" stroke="#e1e6e4" stroke-width="51"/><circle cx="315" cy="397" r="111" fill="none" stroke="#cb4a3e" stroke-width="51" stroke-dasharray="128.25 678.58" transform="rotate(-90 315 397)"/><text x="315" y="411" text-anchor="middle" font-size="58" font-family="Arial" font-weight="800" fill="#142638">18,9%</text><text x="580" y="351" font-size="31" font-family="Arial" font-weight="800" fill="#142638">Tasso di occupazione</text><text x="580" y="402" font-size="24" font-family="Arial" fill="#53697a">Non è la quota di turisti sul totale</text><text x="580" y="438" font-size="24" font-family="Arial" fill="#53697a">dei visitatori, né il PIL turistico.</text><line x1="56" x2="1144" y1="554" y2="554" stroke="#cbd2d8" stroke-width="2"/><text x="56" y="581" font-size="17" font-family="Arial,sans-serif" fill="#516579">Fonte: ONEI, ripreso da EFE, 16 marzo 2026 · efe.com/economia</text><text x="1144" y="582" font-size="18" font-family="Arial,sans-serif" font-weight="800" text-anchor="end" fill="#132536">S-COMODO</text></svg>