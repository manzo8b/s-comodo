<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-label="Indice di percezione della corruzione nel settore pubblico 2025: 24 punti su 100"><rect width="1200" height="570" fill="#faf8f2"/><rect width="1200" height="11" fill="#173743"/><rect x="55" y="58" width="95" height="5" fill="#ce5142"/><text x="55" y="96" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#bb5445">S-COMODO  /  PARAGUAY · DATI E CONTESTO</text><text x="55" y="155" font-family="Arial,sans-serif" font-size="39" font-weight="800" fill="#162e3a">Corruzione percepita nel settore pubblico</text><text x="55" y="199" font-family="Arial,sans-serif" font-size="23" fill="#536f76">Paraguay, CPI 2025 · indice 0–100</text><rect x="80" y="293" width="1020" height="98" rx="10" fill="#e5ece9"/><rect x="80" y="293" width="244.8" height="98" rx="10" fill="#d55042"/><text x="80" y="269" font-family="Arial" font-size="33" font-weight="800" fill="#1a3541">24 / 100</text><text x="80" y="451" font-family="Arial" font-size="20" fill="#526a73">0 = massima corruzione percepita · 100 = minima corruzione percepita</text><line x1="55" y1="503" x2="1145" y2="503" stroke="#d4dedb" stroke-width="2"/><text x="55" y="528" font-family="Arial,sans-serif" font-size="16" fill="#4d6771">Fonte: Transparency International, CPI 2025 · F10</text><text x="55" y="551" font-family="Arial,sans-serif" font-size="14" fill="#60767a">Indice di percezione, non percentuale di fondi pubblici sottratti</text></svg>