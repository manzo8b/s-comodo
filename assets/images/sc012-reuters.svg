<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 665" role="img" aria-labelledby="t d"><title id="t">Reuters Institute, Digital News Report 2026: indicatori mondiali e italiani</title><desc id="d">Media 48 mercati: 54% social e video, 51% siti e app di testate, 42% evitamento notizie almeno qualche volta. Italia: 32% fiducia nelle notizie e 36% evitamento. Basi campionarie diverse, uso fonti sovrapposto.</desc><rect width="1100" height="665" rx="20" fill="#172832"/><g font-family="Arial,sans-serif"><text x="48" y="54" fill="#f7f0e7" font-size="29" font-weight="800">COME CI INFORMIAMO · 2026</text><text x="48" y="90" fill="#f1c56c" font-size="19" font-weight="800">MEDIA DI 48 MERCATI · REUTERS INSTITUTE</text><g font-size="18" fill="#f7f0e7"><text x="48" y="145">Social e piattaforme video</text><text x="48" y="245">Siti e app delle testate</text><text x="48" y="345">Evitano le notizie almeno a volte</text></g><g fill="#384a53"><rect x="460" y="118" width="520" height="33" rx="7"/><rect x="460" y="218" width="520" height="33" rx="7"/><rect x="460" y="318" width="520" height="33" rx="7"/></g><g fill="#ecc775"><rect x="460" y="118" width="281" height="33" rx="7"/><rect x="460" y="218" width="265" height="33" rx="7"/><rect x="460" y="318" width="219" height="33" rx="7"/></g><g fill="#f7f0e7" font-size="27" font-weight="800"><text x="1000" y="144">54%</text><text x="1000" y="244">51%</text><text x="1000" y="344">42%</text></g><path d="M48 407H1050" stroke="#60717a" stroke-width="2"/><text x="48" y="455" fill="#f1c56c" font-size="19" font-weight="800">ITALIA · SCHEDA NAZIONALE</text><g font-size="18" fill="#f7f0e7"><text x="48" y="505">Fiducia generale nelle notizie</text><text x="48" y="580">Evitano le notizie a volte o spesso</text></g><g fill="#384a53"><rect x="460" y="478" width="520" height="30" rx="7"/><rect x="460" y="553" width="520" height="30" rx="7"/></g><g fill="#a7cbd1"><rect x="460" y="478" width="166" height="30" rx="7"/><rect x="460" y="553" width="187" height="30" rx="7"/></g><g fill="#f7f0e7" font-size="27" font-weight="800"><text x="1000" y="505">32%</text><text x="1000" y="580">36%</text></g><text x="48" y="636" font-size="15" fill="#bdc9cc">Percentuali non sommabili; fonti e basi di riferimento distinte · Reuters Institute, Digital News Report 2026.</text></g></svg>