<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
<title id="title">Il cervello non basta — nuova copertina S-COMODO</title>
<desc id="desc">Copertina editoriale con tipografia nera e rossa a sinistra, una figura classica stilizzata che riflette a destra, un cerchio rosso e un punto interrogativo. Nuova composizione senza cervello.</desc>
