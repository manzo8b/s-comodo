<title id="title">Intelligenza non è saggezza — copertina editoriale SC015</title>
<desc id="desc">Composizione editoriale su due zone distinte: a sinistra una frase sul rapporto tra intelligenza e saggezza; a destra un cervello illustrato con reticoli e un punto interrogativo rosso. Testi e illustrazione non si sovrappongono.</desc>
