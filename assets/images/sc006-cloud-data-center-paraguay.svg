  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#da3e48"/><stop offset="1" stop-color="#9c1f32"/></linearGradient>
  <pattern id="grain" width="43" height="41" patternUnits="userSpaceOnUse"><path d="M4 14l2 2M29 33l3-2M14 4l2 3" stroke="#f3e8d5" stroke-width="1" opacity=".12"/></pattern>
