<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">The real weight of the cloud: Paraguay's energy, water and data</title>
<desc id="d">Symbolic illustration linking a hydroelectric dam, a water reservoir, power transmission lines and a data center in Paraguay. Not a photograph or drawing of a specific installation.</desc>
<defs>
