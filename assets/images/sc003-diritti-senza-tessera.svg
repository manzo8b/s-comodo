<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="cover-title cover-description">
<title id="cover-title">I diritti non hanno una tessera di partito</title>
<desc id="cover-description">Allegoria editoriale senza simboli partitici: la Costituzione, il lavoro, i diritti civili e il pluralismo convergono in un libro aperto condiviso.</desc>
