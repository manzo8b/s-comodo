name: Publish S-COMODO
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: s-comodo-pages
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Verify approved publication files
        run: python3 scripts/check_publication.py
      - name: Build Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Validate public SEO output
        run: |
          test -s _site/sitemap.xml
          grep -Fq 'https://manzo8b.github.io/s-comodo/' _site/sitemap.xml
          grep -Fq 'rel="canonical"' _site/index.html
          grep -Fq 'noindex,follow' _site/404.html
          if grep -Fq '<loc>https://manzo8b.github.io/s-comodo/404.html</loc>' _site/sitemap.xml; then
            echo "::error::404 in sitemap"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
